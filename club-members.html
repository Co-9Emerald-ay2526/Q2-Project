<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- PyScript CSS -->
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    <!-- This script tag bootstraps PyScript -->
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <!-- Google Fonts & Font Awesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <title>2Q Drill 2</title>

    <style>
        :root {
            --primary-accent: #6366f1;
            --primary-hover: #4f46e5;
            --gradient-1: linear-gradient(135deg, #4f46e5 0%, #7c3aed 50%, #d946ef 100%);
            --bg-dark: #090d16;
            --card-bg: rgba(18, 24, 38, 0.75);
            --border-glow: rgba(99, 102, 241, 0.3);
            --text-muted: #94a3b8;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(at 0% 0%, rgba(79, 70, 229, 0.18) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(217, 70, 239, 0.15) 0px, transparent 50%);
            background-attachment: fixed;
            color: #f8fafc;
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            padding-bottom: 3rem;
        }

        /* Navbar Styling */
        .navbar-custom {
            background: rgba(15, 23, 42, 0.8) !important;
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .brand-logo {
            font-weight: 800;
            font-size: 1.25rem;
            letter-spacing: -0.5px;
            background: var(--gradient-1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Hero Banner */
        .hero-banner {
            background: var(--gradient-1);
            border-radius: 20px;
            padding: 2.5rem 2rem;
            margin-top: 1.5rem;
            margin-bottom: 2rem;
            box-shadow: 0 10px 30px rgba(99, 102, 241, 0.25);
            position: relative;
            overflow: hidden;
        }

        .hero-banner::after {
            content: '';
            position: absolute;
            top: -50%;
            right: -20%;
            width: 300px;
            height: 300px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            pointer-events: none;
        }

        /* Card Container */
        .club-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 2rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        /* Inputs Styling */
        .form-control {
            background-color: rgba(15, 23, 42, 0.6) !important;
            border: 1px solid rgba(255, 255, 255, 0.15) !important;
            color: #ffffff !important;
            border-radius: 12px;
            padding: 0.8rem 1.2rem;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .form-control::placeholder {
            color: var(--text-muted);
        }

        .form-control:focus {
            border-color: var(--primary-accent) !important;
            box-shadow: 0 0 0 4px var(--border-glow) !important;
            background-color: rgba(15, 23, 42, 0.9) !important;
        }

        /* Button Styling */
        .btn-primary {
            background: var(--gradient-1) !important;
            border: none !important;
            border-radius: 12px !important;
            padding: 0.8rem 1.5rem !important;
            font-weight: 700 !important;
            letter-spacing: 0.5px !important;
            text-transform: uppercase !important;
            font-size: 0.9rem !important;
            transition: transform 0.2s ease, box-shadow 0.2s ease !important;
            width: 100%;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.4);
        }

        /* Output Box Styling (Overrides background-color: red cleanly) */
        #output {
            background: rgba(15, 23, 42, 0.85) !important;
            border: 1px solid var(--border-glow) !important;
            color: #e2e8f0 !important;
            font-family: 'Courier New', Courier, monospace;
            line-height: 1.8;
            box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.5);
        }

        .section-title {
            font-weight: 700;
            letter-spacing: -0.5px;
            color: #ffffff;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="index.html">2Q Drill</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" href="index.html">Homepage</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="elementchecker.html">Element Checker</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="club-members.html">School Club Members</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="creator.html">Meet the Creator</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

    <div class="container mt-4">
        <!-- Hero Banner -->
        <div class="hero-banner">
            <h1 class="fw-bold mb-1"><i class="fa-solid fa-user-plus me-2"></i>Member Registration</h1>
            <p class="mb-0 opacity-90">Enroll new student roster entries into the official society database system.</p>
        </div>

        <!-- Form & Output Card -->
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="club-card">
                    <h3 class="mb-4 section-title h4 d-flex align-items-center gap-2">
                        <i class="fa-solid fa-id-card text-primary"></i>
                        Add new club member:
                    </h3>
                    
                    <form class="mb-4">
                        <div class="mb-3">
                            <input type="text" id="first_name" class="form-control" placeholder="Enter first name">
                        </div>
                        <div class="mb-3">
                            <input type="text" id="last_name" class="form-control" placeholder="Enter last name">
                        </div>
                        <input type="button" value="Submit" py-click="result_checker" class="btn btn-primary">
                    </form>

                    <div class="mt-4">
                        <label class="form-label text-muted small text-uppercase fw-bold mb-2">
                            <i class="fa-solid fa-terminal me-1"></i> System Database Roster Output
                        </label>
                        <div id="output" class="p-3 rounded" style="background-color: red;"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <py-script src="main.py"></py-script>
</body>
</html>
