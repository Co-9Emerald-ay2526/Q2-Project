<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <title>76ers Training Facility - Seatwork 2</title>
    <style>
        :root {
            --sixers-blue: #006bb6;
            --sixers-red: #ed174c;
            --arc-cyan: #7df9ff;
            --bg-dark: #030712;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            font-family: 'Rajdhani', sans-serif;
            color: #f8fafc;
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 50% 20%, rgba(0, 107, 182, 0.25) 0%, transparent 60%),
                radial-gradient(circle at 20% 80%, rgba(237, 23, 76, 0.15) 0%, transparent 50%),
                linear-gradient(180deg, #030712 0%, #0b0f19 100%);
            background-attachment: fixed;
        }

        /* Ensure Navbar sits properly at the top */
        .navbar {
            width: 100%;
        }

        /* Main content wrapper */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            padding: 1.5rem;
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
            position: relative;
        }

        .reactor {
            width: 64px;
            height: 64px;
            margin: 0 auto 0.75rem;
            background: radial-gradient(circle, #fff 0%, var(--sixers-blue) 40%, #032342 80%);
            border: 2px solid var(--arc-cyan);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Orbitron', sans-serif;
            font-size: 1.25rem;
            font-weight: 900;
            color: #fff;
            box-shadow: 0 0 20px rgba(125, 249, 255, 0.6), inset 0 0 10px rgba(255, 255, 255, 0.8);
            animation: pulse-glow 3s infinite alternate;
        }

        header h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(1.8rem, 4vw, 2.6rem);
            font-weight: 900;
            letter-spacing: 0.15em;
            color: #fff;
            text-transform: uppercase;
            text-shadow: 0 0 15px rgba(0, 107, 182, 0.8);
        }

        header p {
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 0.3em;
            color: var(--arc-cyan);
            text-transform: uppercase;
            margin-top: 0.4rem;
        }

        form {
            width: 100%;
            max-width: 440px;
            background: rgba(13, 20, 35, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(125, 249, 255, 0.2);
            border-top: 4px solid var(--sixers-red);
            border-bottom: 4px solid var(--sixers-blue);
            border-radius: 16px;
            padding: 2.5rem 2rem;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.8), inset 0 0 20px rgba(0, 107, 182, 0.05);
            position: relative;
        }

        form input[type="text"] {
            width: 100%;
            margin-bottom: 1.2rem;
            padding: 0.95rem 1.1rem;
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.15rem;
            font-weight: 700;
            color: #fff;
            background: rgba(3, 7, 18, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            outline: none;
            transition: all 0.3s ease;
        }

        form input[type="text"]::placeholder {
            color: #475569;
            font-weight: 500;
        }

        form input[type="text"]:focus {
            border-color: var(--arc-cyan);
            box-shadow: 0 0 15px rgba(125, 249, 255, 0.3);
            background: rgba(5, 12, 26, 0.95);
        }

        form input[type="button"] {
            width: 100%;
            margin-top: 0.6rem;
            padding: 1.1rem;
            font-family: 'Orbitron', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: #fff;
            background: linear-gradient(135deg, var(--sixers-blue) 0%, #003a66 100%);
            border: 1px solid var(--arc-cyan);
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 107, 182, 0.5);
            transition: all 0.3s ease;
        }

        form input[type="button"]:hover {
            background: linear-gradient(135deg, var(--sixers-red) 0%, #a80d32 100%);
            border-color: var(--sixers-red);
            box-shadow: 0 0 25px rgba(237, 23, 76, 0.7);
            transform: translateY(-2px);
        }

        #result {
            width: 100%;
            max-width: 440px;
            margin-top: 1.5rem;
            padding: 1.25rem;
            text-align: center;
            font-size: 1.05rem;
            font-weight: 700;
            background: rgba(13, 20, 35, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(125, 249, 255, 0.3);
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7);
            letter-spacing: 0.05em;
            line-height: 1.5;
        }

        #result:empty { display: none; }

        footer {
            margin: 1.5rem 0;
            text-align: center;
            font-size: 0.75rem;
            letter-spacing: 0.2em;
            color: #64748b;
            text-transform: uppercase;
            font-weight: 600;
            width: 100%;
        }

        footer span { color: var(--arc-cyan); font-weight: 700; }

        @keyframes pulse-glow {
            0% { box-shadow: 0 0 15px rgba(125, 249, 255, 0.4); }
            100% { box-shadow: 0 0 30px rgba(125, 249, 255, 0.8), inset 0 0 12px rgba(255, 255, 255, 0.9); }
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">2Q Drill</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Homepage</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="elementchecker.html">Element Checker</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="club-members.html">School Club Members</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="creator.html">Meet the Creator</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="main-content">
        <header>
            <div class="reactor">76</div>
            <h1>76ers Facility</h1>
            <p>Biometric Security Terminal</p>
        </header>

        <main>
            <form>
                <input type="text" id="first_name" placeholder="Enter your First Name"><br>
                <input type="text" id="last_name" placeholder="Enter your Last Name"><br>
                <input type="button" py-click="candidate_checker" value="Verify Access">
            </form>
            <div id="result"></div>
        </main>
    </div>

    <footer>
        &copy; 2026 <span>Philadelphia 76ers</span> &bull; Camden Security Complex
    </footer>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <py-script src="main.py"></py-script>
</body>
</html>
