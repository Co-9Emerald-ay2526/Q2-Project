<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <!-- PyScript -->
    <link rel="stylesheet" href="https://pyscript.net/releases/2025.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2025.7.3/core.js"></script>

    <style>
        :root {
            --font-main: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            --bg-dark: #0f172a;
            --accent-blue: #3b82f6;
            --accent-purple: #8b5cf6;
            --accent-pink: #ec4899;
        }

        body {
            font-family: var(--font-main);
            background-color: var(--bg-dark);
            color: #f8fafc;
            overflow-x: hidden;
            position: relative;
        }

        /* Background Glowing Orbs */
        .glow-circle {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            z-index: 1;
            opacity: 0.5;
            animation: floatGlow 10s infinite alternate ease-in-out;
        }

        .glow-1 {
            width: 300px;
            height: 300px;
            background: var(--accent-purple);
            top: 10%;
            left: 15%;
        }

        .glow-2 {
            width: 350px;
            height: 350px;
            background: var(--accent-blue);
            bottom: 10%;
            right: 15%;
            animation-delay: -5s;
        }

        @keyframes floatGlow {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, -40px) scale(1.1); }
        }

        .relative-z {
            position: relative;
            z-index: 2;
        }

        /* Glassmorphism Card Wrapper */
        .glass-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.125);
        }

        .card-header-custom {
            background: transparent;
        }

        .header-icon-badge {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            box-shadow: 0 10px 20px rgba(59, 130, 246, 0.3);
        }

        /* Custom Alert & Containers */
        .custom-alert {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .bg-white-10 {
            background: rgba(255, 255, 255, 0.08);
        }

        .border-white-10 {
            border-color: rgba(255, 255, 255, 0.08) !important;
        }

        /* Form Input Styling */
        .custom-input {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff !important;
            padding: 0.8rem 1rem;
            transition: all 0.3s ease;
        }

        .custom-input:focus {
            background: rgba(15, 23, 42, 0.8);
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.25);
        }

        .custom-input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        /* Gradient Action Button */
        .custom-btn {
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            border: none;
            color: #fff;
            padding: 0.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            transition: all 0.3s ease;
            box-shadow: 0 8px 16px rgba(139, 92, 246, 0.25);
        }

        .custom-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(139, 92, 246, 0.4);
            color: #fff;
        }

        .custom-btn:active {
            transform: translateY(0);
        }

        /* Divider Line */
        .custom-divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.15), transparent);
        }

        /* Result Card Container */
        .result-box {
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.08);
            line-height: 1.8;
        }

        /* Styling Python output text injected into #result */
        .result-box b {
            color: var(--accent-blue);
        }

        .tracking-wider {
            letter-spacing: 0.08em;
        }

        .fw-extrabold {
            font-weight: 800;
        }
    </style>

    <title>Skills Test - Non-Metal Elements</title>
</head>
<body>

<!-- Header Navigation -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
    <div class="container-fluid">
        <a class="navbar-brand" href="index.html">2Q Drill</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" href="index.html">Homepage</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" aria-current="page" href="elementchecker.html">Element Checker</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="club-members.html">School Club Members</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="creator.html">Meet the Creator</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- Ambient Background Glowing Circles -->
<div class="glow-circle glow-1"></div>
<div class="glow-circle glow-2"></div>

<div class="container relative-z py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-sm-10 col-md-8 col-lg-5">
            
            <!-- Glassmorphism Card Container -->
            <div class="glass-card shadow-lg rounded-5 overflow-hidden">
                
                <!-- Card Header -->
                <div class="card-header-custom p-4 text-center">
                    <div class="header-icon-badge mb-3 mx-auto">
                        <i class="bi bi-atom fs-2"></i>
                    </div>
                    <h2 class="fw-extrabold text-white mb-1 tracking-tight">Non-Metal Elements</h2>
                    <p class="text-white-50 mb-0 small">Periodic Table Information Finder</p>
                </div>

                <!-- Card Body -->
                <div class="p-4 pt-2">
                    
                    <!-- Instruction Alert -->
                    <div class="custom-alert p-3 rounded-4 mb-4 d-flex align-items-center">
                        <i class="bi bi-lightbulb-fill fs-4 me-3 text-warning"></i>
                        <div class="small text-light">
                            <strong>Instructions:</strong> Enter the <b>symbol</b> of a non-metal element (e.g., <code>H</code>, <code>O</code>, <code>Cl</code>, <code>Xe</code>).
                        </div>
                    </div>

                    <!-- Form Input -->
                    <form onsubmit="event.preventDefault();">
                        <div class="mb-4">
                            <label for="element_name" class="form-label text-white-50 fw-semibold mb-2">
                                <i class="bi bi-search me-1 text-primary"></i> Element Symbol
                            </label>
                            <input
                                type="text"
                                id="element_name"
                                class="form-control form-control-lg custom-input rounded-4"
                                placeholder="e.g. H, O, Cl"
                                autocomplete="off">
                        </div>
                        
                        <div class="d-grid">
                            <button
                                type="button"
                                id="check_btn"
                                py-click="element_checker"
                                class="btn custom-btn btn-lg rounded-4 fw-bold">
                                <span>Check Details</span>
                                <i class="bi bi-arrow-right-short fs-4"></i>
                            </button>
                        </div>
                    </form>

                    <!-- Divider -->
                    <div class="custom-divider my-4"></div>

                    <!-- Result Header -->
                    <h6 class="text-uppercase tracking-wider text-white-50 fw-bold mb-3 small">
                        <i class="bi bi-card-heading me-1 text-info"></i> Result
                    </h6>

                    <!-- Target Result Output -->
                    <div id="result" class="result-box p-3 rounded-4">
                        <em class="text-white-50 small">Enter a symbol above and click "Check Details".</em>
                    </div>

                </div>

                <!-- Card Footer -->
                <div class="text-center py-3 border-top border-white-10">
                    <span class="badge rounded-pill bg-white-10 text-white-50 fw-normal px-3 py-2">
                        <i class="bi bi-code-slash me-1"></i> ICT 10 • Skills Test
                    </span>
                </div>

            </div>

        </div>
    </div>
</div>

<script type="py" src="main.py"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
